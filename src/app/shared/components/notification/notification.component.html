@if (visible) {
  <div class="notification notification--{{ type }}" (click)="dismiss()">

    @switch (type) {
      @case ('success') { <span>✅</span> }
      @case ('error') { <span>❌</span> }
      @case ('warning') { <span>⚠️</span> }
      @default { <span>ℹ️</span> }
    }

    {{ message }}

    <button class="notification__close" (click)="dismiss()">✕</button>
  </div>
}
